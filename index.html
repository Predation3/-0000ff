<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>謎解き</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background:
    radial-gradient(circle at 50% 30%, #202020 0%, #080808 45%, #000 100%);

  color: #ddd;
  font-family: sans-serif;

  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;

  animation: appear 2s ease forwards;
}

@keyframes appear {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

/* 暗転 */
#fade {
  position: fixed;
  inset: 0;

  background: #000;

  opacity: 0;

  pointer-events: none;

  z-index: 999;

  transition: opacity 2.5s ease;
}

#fade.dark {
  opacity: 1;
}

.container {
  width: 90%;
  max-width: 900px;

  text-align: center;

  position: relative;
  z-index: 1;
}

/* 上の文字 */
.binary {
  font-family: monospace;

  font-size: 16px;
  line-height: 1.8;

  color: #aaa;

  word-break: break-all;

  margin-bottom: 45px;

  text-shadow:
    0 0 5px #555,
    0 0 15px #222;
}

.title {
  font-size: 24px;

  letter-spacing: 5px;

  margin-bottom: 30px;

  color: #ccc;

  text-shadow:
    0 0 8px #777,
    0 0 20px #333;
}

input {
  width: 90%;
  max-width: 500px;

  padding: 15px;

  background: rgba(0, 0, 0, 0.7);

  border: 1px solid #555;
  border-radius: 4px;

  color: white;

  font-size: 18px;

  text-align: center;

  outline: none;
}

input:focus {
  border-color: #aaa;

  box-shadow:
    0 0 15px rgba(255,255,255,0.15);
}

button {
  margin-top: 15px;

  padding: 12px 35px;

  background: #111;

  color: #ddd;

  border: 1px solid #555;

  border-radius: 4px;

  font-size: 16px;

  cursor: pointer;
}

button:hover {
  background: #222;

  box-shadow:
    0 0 15px rgba(255,255,255,0.15);
}

#message {
  margin-top: 20px;

  min-height: 25px;

  color: #999;
}

.error {
  color: #a66 !important;
}
</style>
</head>

<body>

<div id="fade"></div>

<div class="container">

  <div class="binary">
    11100011 10000001 10000010 11100011 10000001 10010101 11100011 10000001 10110010 11100011 10000001 10001100 11100011 10000001 10101110 11100011 10000001 10111100 11100011 10000010 10001011 11100011 10000001 10011101 11100011 10000010 10001001 11100011 10000010 10001000
  </div>

  <div class="title">
    答えを入力してください
  </div>

  <input
    type="text"
    id="answer"
    placeholder="答えを入力..."
    autocomplete="off"
  >

  <br>

  <button onclick="checkAnswer()">
    入力
  </button>

  <div id="message"></div>

</div>

<script>

/*
  正解「あさひがのぼるそらよ」のSHA-256
*/
const correctHash =
  "fd198c394d5527f473e7a7a1e107dff6ba1550139db53591f60db7ce8525241e";


async function sha256(text) {

  const data =
    new TextEncoder().encode(text);

  const hashBuffer =
    await crypto.subtle.digest("SHA-256", data);

  const hashArray =
    Array.from(new Uint8Array(hashBuffer));

  return hashArray
    .map(byte =>
      byte.toString(16).padStart(2, "0")
    )
    .join("");
}


async function checkAnswer() {

  const answer =
    document.getElementById("answer").value;

  const fade =
    document.getElementById("fade");

  const message =
    document.getElementById("message");

  const inputHash =
    await sha256(answer);


  if (inputHash === correctHash) {

    /* 正解しても文字は表示しない */

    fade.classList.add("dark");

    setTimeout(() => {

      window.location.href = "next.html";

    }, 2500);

  }

  else {

    message.textContent =
      "……違うようだ。";

    message.className =
      "error";

  }
}


/* Enterキーでも入力可能 */

document
  .getElementById("answer")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      checkAnswer();
    }

  });

</script>

</body>
</html>
