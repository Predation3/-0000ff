<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  overflow: hidden;
  color: #ddd;
  background: radial-gradient(ellipse at center, #202020 0%, #080808 65%, #000 100%);
  font-family: monospace, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.binary {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  color: #555;
  font-size: 11px;
  line-height: 1.8;
  overflow-wrap: anywhere;
  user-select: none;
  opacity: .65;
}

.fog {
  position: fixed;
  inset: -50%;
  pointer-events: none;
  background: radial-gradient(ellipse, #ffffff08 0%, transparent 65%);
  animation: drift 14s ease-in-out infinite alternate;
}

@keyframes drift {
  from { transform: translate(-3%, -2%); }
  to { transform: translate(3%, 2%); }
}

.panel {
  position: relative;
  z-index: 2;
  width: min(88%, 420px);
  text-align: center;
}

.prompt {
  color: #777;
  font-size: 13px;
  letter-spacing: 3px;
  margin-bottom: 22px;
}

input {
  width: 100%;
  padding: 14px;
  color: #ddd;
  background: #080808;
  border: 1px solid #444;
  outline: none;
  font-size: 16px;
  border-radius: 2px;
}

input:focus { border-color: #888; }

button {
  margin-top: 14px;
  padding: 12px 30px;
  color: #bbb;
  background: #151515;
  border: 1px solid #444;
  cursor: pointer;
  letter-spacing: 2px;
}

button:hover { background: #242424; }

button:disabled { opacity: .5; }

#message {
  margin-top: 28px;
  min-height: 52px;
  color: #aaa;
  line-height: 1.8;
  font-size: 15px;
  white-space: pre-line;
}

body.fading {
  animation: darken 2.5s forwards;
}

@keyframes darken {
  to { background: #000; }
}

body.fading .panel,
body.fading .binary,
body.fading .fog {
  opacity: 0;
  transition: opacity 2.5s ease;
}
</style>
</head>

<body>
<div class="binary">

11100011 10000010 10001000
11100011 10000001 10000110

  <div id="message" aria-live="polite"></div>

const form = document.getElementById("entry");
const field = document.getElementById("field");
const send = document.getElementById("send");
const message = document.getElementById("message");

let locked = false;

async function digest(value) {
  const data = new TextEncoder().encode(value);
  const result = await crypto.subtle.digest("SHA-256", data);

  return Array.from(new Uint8Array(result))
    .map(n => n.toString(16).padStart(2, "0"))
    .join("");
}

form.addEventListener("submit", async event => {
  event.preventDefault();

  if (locked) return;

  const value = field.value.trim();
  if (!value) return;

  locked = true;
  field.disabled = true;
  send.disabled = true;
  message.textContent = "";

  const result = await digest(value);

  if (result === key) {
    document.body.classList.add("fading");

    setTimeout(() => {
      location.href = "next.html";
    }, 2600);

    return;
  }

  if (archive.has(result)) {
    message.textContent = "AIにでも頼った？笑😛";

    setTimeout(() => {
      message.textContent = "AIに頼るのは現実的じゃないかもね";

      setTimeout(() => {
        field.value = "";
        field.disabled = false;
        send.disabled = false;
        field.focus();
        locked = false;
      }, 2200);
    }, 1800);

    return;
  }

  send.disabled = false;
  field.focus();
  locked = false;
