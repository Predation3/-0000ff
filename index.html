<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>レトロ謎解き</title>

  <!-- レトロ・ピクセルフォント（Press Start 2P） -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#05060b;
      --card:#0d0f15;
      --accent:#6ef0a6;
      --text:#cfeee3;
      --danger:#ff6b6b;
    }

    html,body{ height:100%; margin:0; font-family: "Press Start 2P", monospace; background: linear-gradient(180deg,#020306,#091018); color:var(--text); -webkit-font-smoothing: none; -moz-osx-font-smoothing: grayscale; overflow:hidden; }

    /* レトロ感のためピクセル化効果 */
    body { image-rendering: pixelated; }

    .container{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
      box-sizing:border-box;
      gap:20px;
      flex-direction:column;
    }

    /* バイナリ（1文字ずつ表示） */
    .binary{
      font-size:12px;
      background:#02040a;
      border:2px solid rgba(110,240,166,0.06);
      padding:10px 14px;
      border-radius:6px;
      color:#9ff5c9;
      letter-spacing:3px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.6);
      width:min(920px,96%);
      text-align:center;
      user-select:text;
      white-space:pre-wrap;
    }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:2px solid rgba(255,255,255,0.04);
      padding:22px;
      border-radius:8px;
      width:min(760px,96%);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      text-align:center;
    }

    h1{ margin:0 0 8px 0; font-size:13px; color:var(--accent); letter-spacing:1px; }
    p.lead{ margin:0 0 18px 0; font-size:11px; opacity:0.9; height:18px; }

    .input-row{ display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap; }
    input[type="text"]{
      background:#06070b;
      color:var(--text);
      border:2px solid rgba(255,255,255,0.02);
      padding:10px 12px;
      border-radius:6px;
      min-width:260px;
      font-size:12px;
      outline:none;
      letter-spacing:1px;
      text-align:center;
    }
    input[type="text"]:focus{ box-shadow:0 6px 18px rgba(110,240,166,0.08); transform:translateY(-1px); }

    button{
      background:linear-gradient(180deg,#5ae89d,#38c77b);
      color:#00210a;
      border:none;
      padding:10px 14px;
      border-radius:6px;
      cursor:pointer;
      font-size:12px;
    }

    .msg{ margin-top:12px; min-height:22px; font-size:11px; color:var(--accent); }

    /* フェードと表示 */
    .fade-out{ animation:page-fade .8s ease forwards; }
    @keyframes page-fade{ to{ opacity:0; transform: scale(0.98) translateY(-8px); filter:blur(2px);} }

    .overlay{
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      z-index:30; pointer-events:none; opacity:0; transition:opacity .5s ease; padding:24px;
      text-align:center; flex-direction:column;
    }
    .overlay.show{ opacity:1; pointer-events:auto; }

    .overlay .box{
      background: linear-gradient(180deg,#0b0d10,#071017);
      border:2px solid rgba(255,255,255,0.03);
      padding:28px; border-radius:10px; max-width:720px;
      box-shadow:0 12px 40px rgba(0,0,0,0.7);
      color:var(--text);
    }
    .overlay h2{ margin:0 0 8px 0; font-size:14px; color:var(--accent); }
    .overlay p{ margin:6px 0 0 0; font-size:11px; opacity:0.95; }

    /* レスポンシブ */
    @media (max-width:520px){
      .binary{ font-size:11px; letter-spacing:2px; }
      h1{ font-size:11px; }
      input[type="text"]{ min-width:160px; width:100%; }
    }
  </style>
</head>
<body>
  <div class="container" id="page">
    <!-- バイナリは data-binary にだけ平文で保持し、表示は JS のタイピングで1文字ずつ描画する -->
    <div id="binary" class="binary" data-binary="11100011 10000001 10000010 11100011 10000001 10010101 11100011 10000001 10110010 11100011 10000001 10001100 11100011 10000001 10101110 11100011 10000001 10111100 11100011 10000010 10001011 11100011 10000001 10011101 11100011 10000010 10001001 11100011 10000010 10001000"></div>

    <div class="card" role="main" aria-labelledby="title">
      <h1 id="title"></h1>
      <p class="lead" id="prompt"> </p>

      <div class="input-row" role="form" aria-label="答えの入力欄">
        <input id="answer" type="text" autocomplete="off" placeholder="" aria-label="答え入力">
        <button id="submitBtn" aria-label="送信">送信</button>
      </div>

      <div class="msg" id="message" aria-live="polite"></div>
    </div>
  </div>

  <!-- 偽答用デコイオーバーレイ（1回目の表示→タップで2回目メッセージに変化） -->
  <div id="decoy" class="overlay" aria-hidden="true">
    <div class="box" id="decoyBox" role="button" tabindex="0" aria-pressed="false">
      <h2 id="decoyTitle">AIにでも頼った？笑😛</h2>
      <p id="decoyBody">（タップして続きを見る）</p>
    </div>
  </div>

  <script>
    // --- タイピング（1文字ずつ） ---
    function typeText(el, text, interval = 24, cb) {
      el.textContent = "";
      let i = 0;
      const t = setInterval(() => {
        el.textContent += text.charAt(i++);
        if (i >= text.length) {
          clearInterval(t);
          if (cb) cb();
        }
      }, interval);
      return t;
    }

    // バイナリは data-binary 属性から取り出し、ページ上に1文字ずつ表示する
    const binEl = document.getElementById('binary');
    const binarySource = binEl.getAttribute('data-binary') || "";
    // 表示用にタイプ（ゆっくりめ）
    typeText(binEl, binarySource, 18, () => {
      binEl.animate([{opacity:1},{opacity:0.8},{opacity:1}],{duration:900,iterations:1});
    });

    // タイトルも1文字ずつ出す（「何が見える？」）
    const titleEl = document.getElementById('title');
    typeText(titleEl, "何が見える？", 28);

    // --- アニメーションする「答えを入力…」の点数切替 ---
    const promptEl = document.getElementById('prompt');
    (function animatePrompt(){
      const base = "答えを入力";
      let dots = 1;
      promptEl.textContent = base + "。".repeat(dots); // 句点（全角）で雰囲気を統一
      setInterval(() => {
        dots = dots % 3 + 1;
        promptEl.textContent = base + "。".repeat(dots);
      }, 500);
    })();

    // --- 正解はバイナリを UTF-8 としてデコードして作る（ソースに平文を残さない） ---
    function decodeBinaryToString(binStr){
      const parts = binStr.trim().split(/\s+/).filter(Boolean);
      const bytes = parts.map(b => parseInt(b, 2) || 0);
      try {
        const decoder = new TextDecoder('utf-8');
        return decoder.decode(new Uint8Array(bytes));
      } catch(e){
        return String.fromCharCode(...bytes);
      }
    }
    const CORRECT = decodeBinaryToString(binarySource);

    // --- 偽答を「直接ベタ書き」しないで生成する機構 ---
    function generateDecoysFrom(correct, targetCount = 60) {
      const set = new Set();

      // 基本的な漢字/表記変換マップ
      const subs = [
        ["あさひ","朝日"], ["あさひ","朝陽"], ["のぼる","昇る"], ["のぼる","登る"],
        ["そら","空"], ["そらよ","空よ"], ["そらよ","そらに"], ["そらよ","そらだ"],
        ["のぼる","のぼり"], ["が","は"], ["が",""], ["よ","ね"]
      ];

      // helper: apply replacements
      function applyReplacements(s){
        const results = new Set();
        // single replacement
        for(const [a,b] of subs){
          if(s.includes(a)){
            results.add(s.replace(a,b));
            // also with punctuation
            results.add(s.replace(a,b)+"。");
            results.add(s.replace(a,b)+"！");
          }
        }
        // swap kana order or remove particles
        if(s.includes("が")){
          results.add(s.replace("が",""));
          results.add(s.replace("が","は"));
        }
        return Array.from(results);
      }

      // helper: small typos (swap adjacent, duplicate, remove)
      function typos(s){
        const arr = Array.from(s);
        const out = new Set();
        for(let i=0;i<arr.length-1;i++){
          const tmp = arr.slice();
          // swap
          [tmp[i], tmp[i+1]] = [tmp[i+1], tmp[i]];
          out.add(tmp.join(''));
          // duplicate a char
          tmp[i] = arr[i];
          tmp[i+1] = arr[i];
          out.add(tmp.join(''));
        }
        // remove one char
        for(let i=0;i<arr.length;i++){
          const tmp = arr.slice(0,i).concat(arr.slice(i+1));
          out.add(tmp.join(''));
        }
        return Array.from(out);
      }

      // helper: spacing / punctuation variants
      function spacingVariants(s){
        return [s, s.replace(/。/g,''), s + "。", s + "　", s.replace(/\s+/g,'')];
      }

      // start from some seeded variants
      const seeds = new Set();
      seeds.add(correct);
      // add some basic transforms
      const r1 = applyReplacements(correct);
      r1.forEach(x => seeds.add(x));
      // also split words and rejoin (naive)
      const naiveSplit = correct.replace(/。/g,'').split(/(?=[がのよには])/).filter(Boolean);
      if(naiveSplit.length > 1){
        seeds.add(naiveSplit.join(' '));
        seeds.add(naiveSplit.reverse().join(''));
      }

      // generate iteratively until reach targetCount
      const pool = Array.from(seeds);
      for(let i=0; i<pool.length && set.size < targetCount; i++){
        const s = pool[i];
        // spacing variants
        spacingVariants(s).forEach(x => set.add(x));
        // typos
        typos(s).forEach(x => set.add(x));
        // further replacements on s
        applyReplacements(s).forEach(x => { set.add(x); pool.push(x); });
        // small punctuation
        set.add(s + "？");
        set.add("「" + s + "」");
        // add minor suffix/prefix
        set.add("きっと" + s);
        set.add(s + "かな");
      }

      // Ensure we don't include the correct answer itself
      set.delete(correct);

      // dedupe and limit
      const arr = Array.from(set).slice(0, targetCount);
      return arr;
    }

    const fakeAnswers = generateDecoysFrom(CORRECT, 80); // 80ほど作る

    // --- ユーティリティ: 正規化（NFKC で全角半角などを統一）---
    function normalizeStr(s){
      if(!s) return "";
      try { s = s.normalize('NFKC'); } catch(e){ /* normalize 未対応環境に配慮 */ }
      return s.trim();
    }

    // --- UI 要素 ---
    const input = document.getElementById("answer");
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("message");
    const page = document.getElementById("page");
    const decoy = document.getElementById("decoy");
    const decoyBox = document.getElementById("decoyBox");
    const decoyTitle = document.getElementById("decoyTitle");
    const decoyBody = document.getElementById("decoyBody");

    function showMessage(text, isError){
      msg.textContent = text;
      msg.style.color = isError ? getComputedStyle(document.documentElement).getPropertyValue('--danger') : getComputedStyle(document.documentElement).getPropertyValue('--accent');
    }

    // フェードアウトして next.html に遷移（正解時）
    function fadeToNextHtml(){
      page.classList.add("fade-out");
      setTimeout(() => {
        window.location.href = "next.html";
      }, 820);
    }

    // 偽答用: オーバーレイ表示
    function showDecoy(){
      decoy.classList.add("show");
      decoy.setAttribute("aria-hidden","false");
      decoyTitle.textContent = "AIにでも頼った？笑😛";
      decoyBody.textContent = "（タップして続きを見る）";
      decoyBox.setAttribute("data-tapped","false");
    }

    // 偽答のタップ動作: 1回目タップでメッセージ切替、2回目以降で閉じる
    function handleDecoyTap(){
      const tapped = decoyBox.getAttribute("data-tapped") === "true";
      if(!tapped){
        decoyTitle.textContent = "AIに頼るのは現実的ではないかもね…";
        decoyBody.textContent = "（もう一度タップして閉じる）";
        decoyBox.setAttribute("data-tapped","true");
      } else {
        decoy.classList.remove("show");
        decoy.setAttribute("aria-hidden","true");
        input.disabled = false;
        btn.disabled = false;
        input.value = "";
        input.focus();
        showMessage("", false);
      }
    }

    decoyBox.addEventListener("click", handleDecoyTap);
    decoyBox.addEventListener("keydown", (e) => { if(e.key === "Enter" || e.key === " ") handleDecoyTap(); });

    // メイン送信処理
    function handleSubmit(){
      const raw = input.value || "";
      const val = normalizeStr(raw);
      if(!val){
        showMessage("何か入力してください。", true);
        input.focus();
        return;
      }

      // 正解チェック（CORRECT はバイナリをデコードして得た文字列）
      if(val === normalizeStr(CORRECT)){
        showMessage("正解です。次のページへ移動します…", false);
        btn.disabled = true; input.disabled = true;
        fadeToNextHtml();
        return;
      }

      // 偽答チェック（偽答は実行時生成）
      const matchedFake = fakeAnswers.some(f => normalizeStr(f) === val);
      if(matchedFake){
        showMessage("ちょっと待って…", false);
        btn.disabled = true; input.disabled = true;
        setTimeout(() => showDecoy(), 360);
        return;
      }

      // それ以外は不正解
      showMessage("不正解です。もう一度試してください。", true);
      input.animate([
        { transform: 'translateX(0)' },
        { transform: 'translateX(-6px)' },
        { transform: 'translateX(6px)' },
        { transform: 'translateX(0)' }
      ], { duration: 260, iterations: 1 });
      input.focus();
    }

    btn.addEventListener("click", handleSubmit);
    input.addEventListener("keydown", (e) => { if(e.key === "Enter") handleSubmit(); });

    // バイナリのクリックで選択しやすくする
    binEl.addEventListener("click", function(){
      const range = document.createRange();
      range.selectNodeContents(this);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });

    // フォーカス調整
    setTimeout(() => input.focus(), 1200);

    // 備考: 正解は実行時にのみ復元されるため、ソースをぱっと見ただけで平文を探すのは難しくしています。
    // 偽答も平文ベタ書きではなく、正解から多様な派生を生成するため、ソース上に直接「本物っぽい」候補を並べていません。
  </script>
</body>
</html>
