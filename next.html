<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>次の謎</title>

  <style>

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      background: #000;

      color: white;

      opacity: 0;

      animation: appear 3s ease forwards;

    }


    @keyframes appear {

      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }

    }


    .content {

      text-align: center;

      padding-top: 100px;

    }

  </style>

</head>


<body>

  <div class="content">

    <h1>次の謎へ</h1>

    <p>ここから次の問題が始まる。</p>

  </div>

</body>

</html>
